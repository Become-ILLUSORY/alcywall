name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

env:
  GO_VERSION: '1.23.x'
  GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
  GOCACHE: ${{ github.workspace }}/.cache/go-build

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # Shared cache: filled by the test job, reused verbatim by the release job
      # below, so publishing a release never recompiles the standard library.
      - name: cache go modules + build cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/go-mod
            .cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-release
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-${{ runner.os }}-

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go test -race -count=1 ./...

  release:
    name: build + publish
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: cache go modules + build cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/go-mod
            .cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-release
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-${{ runner.os }}-

      # The four target binaries are deterministic for a given commit+version,
      # so a re-run (or a retry after a flaky upload) reuses them instead of
      # rebuilding. Keyed on both, so re-tagging the same commit cannot ship a
      # binary with the previous version baked in by -ldflags.
      - name: cache dist
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ github.sha }}-${{ github.ref_name }}-${{ github.event.inputs.tag }}

      - name: resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: build all targets
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          COMMIT: ${{ steps.ver.outputs.commit }}
          DATE: ${{ steps.ver.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%%/*}"
            goarch="${target##*/}"
            out="dist/alcywall-${goos}-${goarch}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "$ldflags" -o "$out" .
          done
          # A bare `alcywall` name for the most common target, so the
          # curl-from-README one-liner works without guessing the suffix.
          cp dist/alcywall-linux-amd64 dist/alcywall
          ( cd dist && sha256sum alcywall-* > SHA256SUMS )
          ls -lh dist

      - name: verify binaries
        run: |
          set -euo pipefail
          for f in dist/alcywall-linux-amd64 dist/alcywall-linux-arm64; do
            file "$f"
            "$f" version || true
          done

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: alcywall ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/alcywall
            dist/alcywall-linux-amd64
            dist/alcywall-linux-arm64
            dist/alcywall-darwin-amd64
            dist/alcywall-darwin-arm64
            dist/SHA256SUMS
          fail_on_unmatched_files: true
